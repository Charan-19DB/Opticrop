{% extends 'base.html' %}
{% block title %}Set New Password – OptiCrop AI{% endblock %}

{% block content %}
<div class="auth-zypheris-wrapper fade-in-up">
    <div class="auth-phone-frame">
        <!-- Top Curved Wave Banner -->
        <div class="auth-wave-banner">
            <h1 class="auth-wave-brand">OptiCrop</h1>
            <div class="auth-wave-subtitle">Secure Password Update</div>
            <svg class="auth-wave-svg" viewBox="0 0 500 150" preserveAspectRatio="none">
                <path d="M0,40 C150,110 350,-20 500,60 L500,150 L0,150 Z" style="stroke: none; fill: rgba(255, 255, 255, 0.35);"></path>
                <path d="M0,70 C180,140 320,10 500,90 L500,150 L0,150 Z" style="stroke: none; fill: #ffffff;"></path>
            </svg>
        </div>

        <!-- Form Card Content -->
        <div class="auth-content-body">
            <h2 class="auth-title mb-2">Set New Password</h2>
            <p class="text-muted text-center small mb-4">
                Please enter your new password below (at least 6 characters).
            </p>

            <form action="{{ url_for('reset_password', token=token) }}" method="POST" id="resetPasswordForm" novalidate>
                <!-- New Password -->
                <div class="auth-input-group">
                    <label for="newPassword" class="auth-label">New Password</label>
                    <input type="password" class="auth-input" id="newPassword" name="password" 
                           placeholder="Enter new password" required autofocus autocomplete="new-password">
                    <button class="auth-toggle-pwd" type="button" id="toggleNewPwd" title="Show/Hide Password">
                        <i class="bi bi-eye" id="toggleNewPwdIcon"></i>
                    </button>
                </div>

                <!-- Confirm Password -->
                <div class="auth-input-group mb-3">
                    <label for="confirmNewPassword" class="auth-label">Confirm New Password</label>
                    <input type="password" class="auth-input" id="confirmNewPassword" name="confirm_password" 
                           placeholder="Re-enter new password" required autocomplete="new-password">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-submit-btn" id="savePasswordBtn">
                    Update Password &amp; Sign In
                </button>
            </form>

            <div class="auth-footer-link mt-3">
                Remember your password? <a href="{{ url_for('login') }}">Back to Log in</a>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggleNewPwd');
    const pwdInput = document.getElementById('newPassword');
    const toggleIcon = document.getElementById('toggleNewPwdIcon');
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    }
});
</script>
{% endblock %}
