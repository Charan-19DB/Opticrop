{% extends 'base.html' %}
{% block title %}Create Account – OptiCrop AI{% endblock %}

{% block content %}
<div class="auth-zypheris-wrapper fade-in-up">
    <div class="auth-phone-frame" style="max-width: 480px;">
        <!-- Top Curved Wave Banner -->
        <div class="auth-wave-banner" style="padding: 2.75rem 1.5rem 3.75rem;">
            <h1 class="auth-wave-brand">OptiCrop</h1>
            <div class="auth-wave-subtitle">Smart Farm Intelligence</div>
            <svg class="auth-wave-svg" viewBox="0 0 500 150" preserveAspectRatio="none">
                <path d="M0,40 C150,110 350,-20 500,60 L500,150 L0,150 Z" style="stroke: none; fill: rgba(255, 255, 255, 0.35);"></path>
                <path d="M0,70 C180,140 320,10 500,90 L500,150 L0,150 Z" style="stroke: none; fill: #ffffff;"></path>
            </svg>
        </div>

        <!-- Form Card Content -->
        <div class="auth-content-body" style="padding: 1.5rem 2rem 2rem;">
            <h2 class="auth-title mb-3" style="font-size: 1.7rem;">Create Account</h2>

            <!-- Fast-track Google Sign-Up -->
            <a href="{{ url_for('auth_google') }}" class="btn btn-outline-dark w-100 rounded-pill py-2 mb-3 fw-semibold d-flex align-items-center justify-content-center gap-2 border-opacity-25 shadow-sm" style="font-size: 0.92rem;">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Sign up with Google</span>
            </a>

            <div class="auth-divider">OR REGISTER WITH EMAIL</div>

            <form action="{{ url_for('signup') }}" method="POST" id="signupForm" novalidate>
                <!-- Full Name -->
                <div class="auth-input-group">
                    <label for="userName" class="auth-label">Full Name</label>
                    <input type="text" class="auth-input" id="userName" name="name" 
                           placeholder="Raju Charan" required autocomplete="name"
                           value="{{ request.form.get('name', '') }}">
                </div>

                <!-- Email Address -->
                <div class="auth-input-group">
                    <label for="userEmail" class="auth-label">Email Address</label>
                    <input type="email" class="auth-input" id="userEmail" name="email" 
                           placeholder="farmer@opticrop.io" required autocomplete="email"
                           value="{{ request.form.get('email', '') }}">
                </div>

                <!-- Farm / Producer Name -->
                <div class="auth-input-group">
                    <label for="farmName" class="auth-label">Farm / Estate Name (Optional)</label>
                    <input type="text" class="auth-input" id="farmName" name="farm_name" 
                           placeholder="e.g. Green Valley Farm"
                           value="{{ request.form.get('farm_name', '') }}">
                </div>

                <!-- Password -->
                <div class="auth-input-group">
                    <label for="userPassword" class="auth-label">Password (Min. 6 characters)</label>
                    <input type="password" class="auth-input" id="userPassword" name="password" 
                           placeholder="Create password" required autocomplete="new-password">
                    <button class="auth-toggle-pwd" type="button" id="toggleSignupPwd" title="Show/Hide Password">
                        <i class="bi bi-eye" id="toggleSignupIcon"></i>
                    </button>
                </div>

                <!-- Confirm Password -->
                <div class="auth-input-group mb-3">
                    <label for="confirmPassword" class="auth-label">Confirm Password</label>
                    <input type="password" class="auth-input" id="confirmPassword" name="confirm_password" 
                           placeholder="Re-enter password" required autocomplete="new-password">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-submit-btn" id="signupSubmitBtn">
                    Create Free Account
                </button>
            </form>

            <!-- Footer: Switch to Login -->
            <div class="auth-footer-link">
                Already have an Account? <a href="{{ url_for('login') }}">Log in</a>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggleSignupPwd');
    const pwdInput = document.getElementById('userPassword');
    const toggleIcon = document.getElementById('toggleSignupIcon');
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    }
});
</script>
{% endblock %}
