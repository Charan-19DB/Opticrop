
services:
  # OptiCrop AI Production Application Service
  opticrop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opticrop-ai-engine
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-opticrop_production_super_secret_key_2026}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-opticrop_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_PATH=/app/dataset/opticrop.db
    volumes:
      - opticrop_data:/app/dataset
      - ./static/reports:/app/static/reports
    restart: unless-stopped

volumes:
  opticrop_data:
    driver: local
